<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cybergirl · 聊天读取</title><link rel="stylesheet" href="/assets/styles/base.css"><script type="module" src="/assets/history/history.js"></script></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">Cybergirl · 聊天读取</div><p class="sidebar-note">查看本机已有消息。<br>保存过的记录可离线打开。</p><p class="sidebar-note">群发送关闭；查看和更新均不调用模型。</p></aside><main><header class="topbar"><strong>聊天读取工作台</strong></header>
<section class="card"><h2>持续读取</h2><p>加入群聊或私聊后，服务会自动更新本机最近200条消息。关闭页面继续读取；服务重启恢复订阅。不会触发回复。</p><form id="reads-form"><label for="read-kind">会话类型</label><select id="read-kind"><option value="group">群聊</option><option value="dm">私聊</option></select><label for="read-name">完整群名／好友昵称或备注（唯一匹配）</label><input id="read-name" maxlength="128" required><button id="read-add" class="button primary">加入持续读取</button></form><p id="reads-status" role="status" aria-live="polite"></p><div id="reads-list"></div><p class="muted">每次读取结束后等待30秒，多个会话依次读取；失败最多等待5分钟再试。仅保存最近200条快照，不保证完整消息归档；图片／语音只显示类型。微信关闭或原窗口绑定失效时显示错误。</p></section><section class="card"><form id="history-form"><label for="group">群名称（精确匹配）</label><input id="group" value="KG牛牛俱乐部" maxlength="128" required><label for="limit">最近消息数量</label><input id="limit" type="number" min="1" max="200" value="200" required><p><button class="button primary" type="submit" id="load">查看已保存记录</button> <button class="button outline" type="button" id="update">从微信本地库更新</button></p></form><p class="muted">更新需要微信进程运行，无需打开群窗口或切到前台。图片、语音等只显示类型。</p><p id="history-status" role="status" aria-live="polite"></p></section>
<section class="card"><p><button id="export-json" class="button outline" disabled>导出JSON</button> <button id="export-text" class="button outline" disabled>导出文本</button></p><div id="history-messages" class="event-list"></div></section></main></div></body></html>
